name: Release matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

jobs:
  portability:
    name: ${{ matrix.os }} portability
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: python -m pip install -e "backend[dev]"

      - name: Verify backend
        run: |
          ruff check backend/
          ruff format --check backend/
          cd backend
          mypy .
          pytest
          python -m evals.runner --mode fixture --threshold 0.9
          python scripts/restore_drill.py

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run test:run
          npm run build

  docker:
    name: Linux container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t loom:release-matrix .
      - name: Verify pre-onboarding liveness
        run: |
          docker run -d --name loom-release -p 8000:8000 loom:release-matrix
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/live; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/live | grep -q '"live":true'
          docker rm -f loom-release
